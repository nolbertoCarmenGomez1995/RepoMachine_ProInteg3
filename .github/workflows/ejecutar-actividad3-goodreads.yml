name: Ejecutar Actividad 3 - Goodreads

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reportes-automaticos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  entrenar-evaluar:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar con main
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          git merge --ff-only origin/main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar pruebas de preparación y auditoría
        run: python -m unittest discover -s tests -v

      - name: Ejecutar la segmentación K-Means
        run: |
          mkdir -p artifacts modelos/libros reportes
          python -m src.actividad3_goodreads
          cp reportes/actividad3_goodreads.txt artifacts/
          cp reportes/hallazgos_actividad3.md artifacts/
          cp -R reportes/figuras artifacts/
          cp modelos/libros/kmeans_actividad3_goodreads.joblib artifacts/

      - name: Guardar copia actualizada del resumen en main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reportes/actividad3_goodreads.txt \
            reportes/figuras/*.png

          if git diff --cached --quiet; then
            echo "El resumen no tuvo cambios."
            exit 0
          fi

          git commit -m "chore: actualizar resultados Actividad 3 Goodreads [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publicar evidencias de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: resultados-actividad-3-goodreads
          path: |
            artifacts/actividad3_goodreads.txt
            artifacts/hallazgos_actividad3.md
            artifacts/figuras/*.png
            artifacts/kmeans_actividad3_goodreads.joblib
          if-no-files-found: error
          retention-days: 30
